services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: theefinder-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: theefinder
      POSTGRES_USER: theefinder
      POSTGRES_PASSWORD: theefinder_dev
    ports:
      - "5432:5432"
    volumes:
      - theefinder_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theefinder -d theefinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  theefinder_postgres_data:
